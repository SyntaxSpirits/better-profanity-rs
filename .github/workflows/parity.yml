name: Full parity

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Texts per corpus (empty for all, about 260,000 texts)"
        required: false
        default: "20000"

permissions:
  contents: read

jobs:
  parity:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev --group bench
      - name: Compare with better_profanity
        shell: bash
        run: |
          cd benchmarks
          uv run python parity.py ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }} --output parity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-${{ matrix.os }}-${{ matrix.python }}
          path: bindings/python/benchmarks/parity.json
