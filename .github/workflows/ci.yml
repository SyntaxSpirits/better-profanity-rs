name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p better-profanity

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.13"
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev
      - run: uv run pytest

  musl:
    runs-on: ubuntu-latest
    container: python:3.13-alpine
    steps:
      - uses: actions/checkout@v4
      - run: apk add --no-cache build-base cargo
      - run: pip install --root-user-action=ignore maturin pytest hypothesis better-profanity==0.7.0
      - run: cd bindings/python && pip install --root-user-action=ignore . && python -m pytest

  upstream-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bundled files are those of better_profanity 0.7.0
        run: |
          pip download --no-deps --no-binary :all: better-profanity==0.7.0 -d /tmp/upstream
          echo "8a6fdc8606d7471e7b5f6801917eca98ec211098262e82f62da4f5de3a73145b  /tmp/upstream/better_profanity-0.7.0.tar.gz" | sha256sum -c
          tar -xzf /tmp/upstream/better_profanity-0.7.0.tar.gz -C /tmp/upstream
          src=/tmp/upstream/better_profanity-0.7.0/better_profanity
          pkg=bindings/python/python/better_profanity_rs
          for f in better_profanity.py constants.py utils.py varying_string.py profanity_wordlist.txt alphabetic_unicode.json; do
            cmp "$src/$f" "$pkg/$f"
          done
          for f in profanity_wordlist.txt alphabetic_unicode.json; do
            cmp "$src/$f" "crates/better-profanity/data/$f"
          done

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: bindings/python
      - uses: astral-sh/ruff-action@v3
        with:
          src: bindings/python
          args: format --check
